name: Checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest pytest-asyncio ruff mypy
      - run: python scripts/build_frontend.py && git diff --exit-code
      - run: ruff format --check custom_components pixeltool tests scripts
      - run: ruff check custom_components pixeltool tests scripts
      - run: mypy pixeltool custom_components
      - run: pytest -q
      - run: node --check pixeltool/static/app.js && node --check custom_components/baldrick_controller/frontend/pixeltool-panel.js
      - run: docker build -t pixeltool-check .
  ha-runtime-floor:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install 'homeassistant>=2026.9,<2026.10'
      - run: python scripts/verify_installed_ha.py
